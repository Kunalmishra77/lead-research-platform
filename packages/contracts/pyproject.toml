[project]
name = "leadforge-contracts"
version = "0.1.0"
description = "Pydantic models generated from packages/contracts/schemas (do not edit generated files)."
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic>=2.13,<3", "typing-extensions>=4.12"]

[dependency-groups]
dev = [
  "datamodel-code-generator==0.82.0",
  "pytest>=9.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["generated/python/leadforge_contracts"]

[tool.pytest.ini_options]
testpaths = ["tests_py"]
