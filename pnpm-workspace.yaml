packages:
  - apps/*
  - packages/*
  - infra/*
  - db
allowBuilds:
  '@scarf/scarf': false
  '@sentry/cli': false # source-map upload CLI; not used (no withSentryConfig)
  '@swc/core': true
  esbuild: true
minimumReleaseAgeExclude:
  - prettier@3.9.8
  - '@aws-sdk/client-s3@3.1135.0'
  - '@fastify/static@10.1.4'
overrides:
  # @nestjs/platform-fastify 11.2.5 pins fastify 5.11.3 (GHSA-w2qp-rph6-63g4, GHSA-3m5p-2c4r-xxw2).
  fastify: 5.12.5
