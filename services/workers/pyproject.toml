[project]
name = "leadforge-workers"
version = "0.1.0"
description = "LeadForge Python workers: job framework, connectors, pipeline (docs/01, docs/06)."
requires-python = ">=3.12,<3.13"
dependencies = [
  "leadforge-contracts",
  "pydantic>=2.13,<3",
  "pydantic-settings>=2.15,<3",
  "redis>=8.1,<9",
  "sqlalchemy[asyncio]>=2.0.54,<2.1",
  "asyncpg>=0.31,<0.32",
  "structlog>=26.1",
  "opentelemetry-api>=1.44,<2",
  "opentelemetry-sdk>=1.44,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.44,<2",
  "aioboto3>=15.5,<16",
  "uuid6>=2025.0.1",
  "uvloop>=0.22; sys_platform != 'win32'",
]

[dependency-groups]
dev = [
  "pytest>=9.1",
  "pytest-asyncio>=1.4",
  "fakeredis[lua]>=2.38",
  "respx>=0.23",
  "ruff>=0.16",
  "mypy>=2.3",
]

[tool.uv.sources]
leadforge-contracts = { path = "../../packages/contracts", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "S", "ASYNC", "RUF", "SIM", "PTH", "TRY", "PL"]
ignore = ["TRY003", "PLR0913", "PLR2004"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "PLR2004", "PLR0915"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["aioboto3.*", "botocore.*", "fakeredis.*"]
ignore_missing_imports = true
